schema_version: 1
application:
  name: giftvault
  display_name: GiftVault
  group: Open
source:
  branch: main
runtime:
  type: python
  version: "3.10.12"
  working_dir: .
build:
  working_dir: .
  commands:
    - ["python", "-m", "pip", "install", "-r", "requirements.txt"]
service:
  type: systemd
  entrypoint: ["gunicorn", "--bind", "127.0.0.1:5090", "--workers", "2", "--threads", "2", "--access-logfile", "-", "--error-logfile", "-", "app:create_app()"]
  port: 5090
  health_path: /health
proxy:
  enabled: true
  path: /apps/giftvault/
  authentication: uda
environment:
  required:
    - GIFT_AUTH_HEADER
    - GIFT_DATA_DIR
    - GIFT_TRUSTED_PROXY_IPS
    - GIFT_USERS
deployment:
  auto_update: true
  rollback: true
  github_reporting: false

